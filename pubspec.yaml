name: khmer_gift_collection
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  # sdk: ^3.11.0
  sdk: ">=3.5.4 <4.0.0"

dependencies:
  url_launcher: ^6.3.0

  flutter:
    sdk: flutter
  image_picker: ^1.1.2

  # Backend & Auth (Developer 3)
  supabase_flutter: ^2.12.4 # Double check latest version on pub.dev

  # State Management (Developer 1 & 3)
  flutter_riverpod: ^3.3.1

  # Maps & Location (Developer 2)
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0

  # Custom Layouts & Icons
  flutter_svg: ^2.0.10
  intl: ^0.19.0 # For local currency/date formatting

  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  video_player: ^2.8.1 # For Workshop Reels
  shimmer: ^3.0.0 # For better loading states
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/

